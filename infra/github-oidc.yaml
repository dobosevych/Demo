AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lets GitHub Actions deploy this project without any stored credentials. It
  registers GitHub's OIDC issuer as an identity provider and creates one role
  that only workflows in a named repository can assume. Each run receives
  short-lived credentials; nothing long-lived is ever put in the repository.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z0-9-]+"
  GitHubRepo:
    Type: String
    Description: The repository allowed to assume the role, as owner/name.
    AllowedPattern: "[A-Za-z0-9._-]+/[A-Za-z0-9._-]+"
  GitHubRef:
    Type: String
    Default: "*"
    Description: >
      Which refs may assume it. "*" is any branch, tag or environment.
      Note the subject depends on how the job is written: a job with an
      `environment:` sends "environment:<name>", NOT "ref:refs/heads/<branch>".
      deploy-backend.yml uses `environment: aws`, so narrowing this means
      "environment:aws", not a branch ref.
  CreateOidcProvider:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >
      An account can hold only one provider per issuer. Set to "no" if
      token.actions.githubusercontent.com is already registered.

Conditions:
  ShouldCreateProvider: !Equals [!Ref CreateOidcProvider, "yes"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS verifies GitHub's certificate chain against its own trust store, so
      # these are not load-bearing. Both of GitHub's published thumbprints are
      # listed anyway, because the property must be present and a single stale
      # value is a known source of confusing failures.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-deploy"
      Description: !Sub "Assumed by GitHub Actions in ${GitHubRepo}"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              # !Ref on an OIDCProvider returns its ARN, and creates a real
              # dependency so it is never referenced before it exists. When the
              # provider already existed, fall back to naming it directly.
              Federated: !If
                - ShouldCreateProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # Without this, any OIDC issuer audience could be replayed here.
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # The lines that limit the role to one repository. Two patterns,
                # matched as OR, because GitHub issues the subject in either of
                # two shapes and which one you get is not up to you:
                #
                #   classic:   repo:owner/name:environment:aws
                #   immutable: repo:owner@1234/name@5678:environment:aws
                #
                # The immutable form embeds the numeric owner and repository IDs,
                # so that a renamed or re-created repository cannot inherit the
                # trust of the old one. Matching only the classic form fails with
                # "Not authorized to perform sts:AssumeRoleWithWebIdentity", which
                # says nothing about why.
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepo}:${GitHubRef}"
                  - !Sub
                    - "repo:${Owner}@*/${Name}@*:${GitHubRef}"
                    - Owner: !Select [0, !Split ["/", !Ref GitHubRepo]]
                      Name: !Select [1, !Split ["/", !Ref GitHubRepo]]
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The stacks this project owns, and nothing else.
              - Sid: CloudFormationOnProjectStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplateSummary
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/${ProjectName}-*/*"

              - Sid: CloudFormationReadOnly
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:ListStacks
                Resource: "*"

              # Pushing the image. The auth token call cannot be scoped.
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"

              - Sid: EcrRepository
                Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:TagResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/${ProjectName}-*"

              - Sid: EcrCreate
                Effect: Allow
                Action: ecr:CreateRepository
                Resource: "*"

              # The services the stacks build. These APIs create networking and
              # managed resources whose ARNs do not exist until creation, so
              # they cannot be scoped by resource in any useful way.
              - Sid: Infrastructure
                Effect: Allow
                Action:
                  - ecs:*
                  - elasticloadbalancing:*
                  - rds:*
                  - ec2:*
                  - logs:*
                  - acm:*
                  - s3:*
                  - cloudfront:*
                Resource: "*"

              # Only the roles CloudFormation creates for this project, and
              # only handing them to the services that run the tasks.
              - Sid: ProjectRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*"

              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - rds.amazonaws.com

Outputs:
  RoleArn:
    Description: Set this as the AWS_ROLE_ARN repository variable in GitHub.
    Value: !GetAtt DeployRole.Arn
