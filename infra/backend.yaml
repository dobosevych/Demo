AWSTemplateFormatVersion: "2010-09-09"
Description: >
  The meetings backend, built to cost almost nothing while idle: the FastAPI
  image runs on Lambda behind a function URL, and the database is Aurora
  Serverless v2 with a minimum of 0 ACU, so it pauses when nobody uses it. There
  is no load balancer, no NAT gateway and no public IP address, which are the
  things that bill by the hour whether or not anything happens.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z0-9-]+"
  ImageUri:
    Type: String
    Description: >
      ECR image URI pinned by digest, e.g.
      <account>.dkr.ecr.<region>.amazonaws.com/meetings-backend@sha256:...
      A digest rather than :latest, so that a new image is a change the stack sees.
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 63
    AllowedPattern: "[^/@\" ]+"
    Description: Master password for the database. Comes from .env, never committed.
  DbEngineVersion:
    Type: String
    Default: "16.6"
    Description: >
      Aurora PostgreSQL version. Pausing at 0 ACU needs 13.15, 14.12, 15.7, 16.3
      or later in each line.
  DbMaxCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 16
    Description: Upper bound in ACUs (1 ACU is about 2 GB of memory).
  DbSecondsUntilPause:
    Type: Number
    Default: 300
    MinValue: 300
    MaxValue: 86400
    Description: Idle time before the database pauses. 300 is the minimum.
  CorsOrigins:
    Type: String
    Default: "*"
    Description: >
      Comma-separated origins the API accepts. The frontend reaches it through
      its own CloudFront distribution, same-origin, so this only matters for
      calls made straight to the function URL.

Resources:
  # --- Network -------------------------------------------------------------
  # Private subnets only. Lambda reaches the database inside the VPC and needs
  # nothing from the internet: its image is pulled by the Lambda service and its
  # logs are shipped by it, not through these subnets.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-backend"

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]

  # --- Security groups -----------------------------------------------------
  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: The API function. Accepts nothing; only connects out to the database.
      VpcId: !Ref Vpc

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database. Reachable only from the function.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref FunctionSecurityGroup
          Description: Postgres, from the API function only

  # --- Database ------------------------------------------------------------
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} backend database"
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB

  DbCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Sub "${ProjectName}-backend"
      Engine: aurora-postgresql
      EngineVersion: !Ref DbEngineVersion
      DatabaseName: meetings
      MasterUsername: meetings
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds:
        - !GetAtt DbSecurityGroup.GroupId
      # MinCapacity 0 is what lets it pause. The first connection after a pause
      # waits roughly 15 seconds while it resumes.
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0
        MaxCapacity: !Ref DbMaxCapacity
        SecondsUntilAutoPause: !Ref DbSecondsUntilPause
      StorageEncrypted: true
      BackupRetentionPeriod: 1
      CopyTagsToSnapshot: true
      DeletionProtection: false

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Ref DbCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false

  # --- API -----------------------------------------------------------------
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-backend"
      RetentionInDays: 7

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Logs, plus the network interfaces a function in a VPC needs.
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"

  # The same image compose runs. The Lambda Web Adapter baked into it turns each
  # invocation into an HTTP request to uvicorn, so the app needs no Lambda code.
  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-backend"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [x86_64]
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 1024
      # Covers a cold start that also has to wake the database.
      Timeout: 60
      LoggingConfig:
        LogGroup: !Ref LogGroup
      VpcConfig:
        SubnetIds:
          - !Ref SubnetA
          - !Ref SubnetB
        SecurityGroupIds:
          - !Ref FunctionSecurityGroup
      Environment:
        Variables:
          DATABASE_URL: !Sub "postgresql+psycopg://meetings:${DbPassword}@${DbCluster.Endpoint.Address}:${DbCluster.Endpoint.Port}/meetings"
          # A pooled connection held by a frozen function would keep the
          # database from ever pausing.
          DB_KEEP_CONNECTIONS: "false"
          CORS_ORIGINS: !Ref CorsOrigins
          AWS_LWA_PORT: "8000"
          # Startup runs migrations and may wait on a paused database, which can
          # outlast Lambda's 10-second init phase. This lets it finish inside
          # the first invocation instead of failing init.
          AWS_LWA_ASYNC_INIT: "true"

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE

  # A public function URL needs both permissions.
  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Description: >
      The function URL, callable directly. The frontend does not use it: it
      reaches the API at /api on its own CloudFront domain.
    Value: !GetAtt FunctionUrl.FunctionUrl
  ApiOriginDomain:
    Description: Hostname of the function URL. The frontend stack's /api origin.
    Value: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
  FunctionName:
    Value: !Ref Function
  DbClusterId:
    Value: !Ref DbCluster
  DbEndpoint:
    Description: Database address. Reachable only from inside the VPC.
    Value: !GetAtt DbCluster.Endpoint.Address
