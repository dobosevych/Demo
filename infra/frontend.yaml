AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Static hosting for the meetings frontend: a private S3 bucket holding the Vite
  bundle, fronted by CloudFront. The bucket is never public; CloudFront reaches it
  through an Origin Access Control, and the bucket policy trusts only this
  distribution. The distribution serves the frontend only, on the CloudFront
  flat-rate Free plan; the browser calls the backend directly.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Prefix for resource names.
    AllowedPattern: "[a-z0-9-]+"
  FrontendDomain:
    Type: String
    Default: ""
    Description: >
      Custom hostname for the site, e.g. demo.dobosevych.com. Empty serves it
      on the *.cloudfront.net domain only. The DNS lives outside Route 53, so
      two CNAMEs must be added by hand; `make frontend-dns` prints them.

Conditions:
  HasDomain: !Not [!Equals [!Ref FrontendDomain, ""]]

# CloudFront takes certificates and CLOUDFRONT-scope web ACLs from us-east-1
# only, so this stack must live there. Fail at validation, not mid-create.
Rules:
  UsEast1Only:
    Assertions:
      - Assert: !Equals [!Ref AWS::Region, us-east-1]
        AssertDescription: >
          Deploy this stack in us-east-1 (AWS_REGION=us-east-1): CloudFront
          accepts certificates and web ACLs from that region only.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    # Deliberately NOT DeletionPolicy: Retain. This bucket only ever holds the
    # built bundle, which `make frontend-build` regenerates from source. Retaining
    # it means a failed create leaves an orphan behind that collides with the next
    # attempt — a trap, in exchange for protecting nothing irreplaceable.
    Properties:
      BucketName: !Sub "${ProjectName}-frontend-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-frontend-oac"
        Description: Lets this distribution, and only this distribution, read the bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # A single-page app: a path with no file extension is one of the app's own
  # routes, so it is served index.html. This replaces custom error responses,
  # which would also rewrite the API's own 404s into the app's HTML.
  SpaRouting:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectName}-frontend-spa-routing"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for app routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var last = request.uri.split("/").pop();
          if (last.indexOf(".") === -1) {
            request.uri = "/index.html";
          }
          return request;
        }

  # Required by the flat-rate plan, and included in it. Allow-all with no
  # rules: the plan's DDoS protection applies regardless.
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${ProjectName}-frontend"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: false
        CloudWatchMetricsEnabled: false
        MetricName: !Sub "${ProjectName}-frontend"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Stays PENDING_VALIDATION until its CNAME is in DNS, and the stack waits on
  # it: on the first deploy, run `make frontend-dns` in another terminal and
  # add the records it prints.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref FrontendDomain
      ValidationMethod: DNS
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${ProjectName} frontend"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        # A WAFv2 web ACL is associated by ARN; the flat-rate plan requires one.
        WebACLId: !GetAtt WebAcl.Arn
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          # Managed-CachingOptimized. Hashed asset filenames make this safe; only
          # index.html is re-uploaded with a no-cache header by `make frontend-deploy`.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRouting.FunctionARN
        Aliases: !If [HasDomain, [!Ref FrontendDomain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref Certificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Flat-rate Free plan: $0/month, no overage charges, activates immediately.
  # An account may hold at most 3 Free plans. The references make CloudFormation
  # create this last and delete it first.
  PricingPlan:
    Type: AWS::PricingPlanManager::Subscription
    Properties:
      PlanFamily: CloudFront
      PlanTier: FREE
      UsageLevel: DEFAULT
      ResourceArns:
        - !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
        - !GetAtt WebAcl.Arn

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Description: Bucket the bundle is synced into.
    Value: !Ref SiteBucket
  DistributionId:
    Description: Distribution to invalidate after a sync.
    Value: !Ref Distribution
  SiteUrl:
    Description: Public URL of the deployed frontend.
    Value: !If
      - HasDomain
      - !Sub "https://${FrontendDomain}"
      - !Sub "https://${Distribution.DomainName}"
  DistributionDomain:
    Description: What the FrontendDomain CNAME must point to.
    Value: !GetAtt Distribution.DomainName
