name: Deploy backend

on:
  # Deploying costs money and changes a live system, so it never runs on a push
  # by itself. Trigger it deliberately.
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm
        required: true
        default: ""

# Never let two deployments touch the same stack at once.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # for OIDC, if AWS_ROLE_ARN is configured

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - name: Check the confirmation
        if: inputs.confirm != 'deploy'
        run: |
          echo "::error::Type 'deploy' in the confirm box to run this workflow."
          exit 1

      - name: Check the role is configured
        if: vars.AWS_ROLE_ARN == ''
        run: |
          echo "::error::AWS_ROLE_ARN repository variable is not set."
          echo "::error::Create the role with 'make github-oidc', then set the variable."
          exit 1

      # Diagnostic: print the claims AWS will evaluate, so a trust-policy denial
      # can be read rather than guessed at. Only selected claims are printed —
      # never the token itself, which is a credential.
      - name: Show OIDC claims
        run: |
          set -euo pipefail
          token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')
          payload=$(echo "$token" | cut -d. -f2)
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          [ "$pad" -gt 0 ] && payload="${payload}$(printf '=%.0s' $(seq 1 $pad))"
          echo "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{iss, aud, sub, repository, repository_owner, ref, environment}'
          echo
          echo "The trust policy must match sub and aud exactly (StringLike is case-sensitive)."

      - uses: actions/checkout@v4

      # OIDC only. GitHub mints a short-lived token for this run, AWS exchanges
      # it for temporary credentials, and they expire when the job ends. There
      # is no access key in this repository to leak or rotate.
      # The role is created by infra/github-oidc.yaml and trusts only this repo.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: deploy-backend-${{ github.run_id }}

      - uses: docker/setup-buildx-action@v3

      # The same target the Makefile uses locally, so there is one deployment
      # path rather than two that can drift apart.
      - name: Deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        run: make backend-deploy

      # One real request: it cold-starts the function, wakes the database if it
      # has paused, and applies any pending migrations.
      - name: Smoke test
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
        run: |
          url=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-backend" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          curl -fsS --retry 3 --retry-all-errors --max-time 60 "${url%/}/api/meetings" >/dev/null
          echo "API answered."

      - name: Report the URL
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
        run: |
          url=$(aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-backend" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "### Backend deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$url\`" >> "$GITHUB_STEP_SUMMARY"

      # If anything above failed, print why rather than leaving a red X.
      - name: Explain a failure
        if: failure()
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
        run: make STACK_NAME="${PROJECT_NAME}-backend" explain-failure || true
